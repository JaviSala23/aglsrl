{% extends 'cuentas/base.html' %}
{% block content %}
<h2>Eliminar provincia</h2>
<p>¿Estás seguro de que deseas eliminar la provincia "{{ object.nombre_provincia }}"?</p>
<form method="post">{% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'cuentas:provincia_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
