{% extends 'cuentas/base.html' %}
{% block content %}
<h2>Eliminar localidad</h2>
<p>¿Estás seguro de que deseas eliminar la localidad "{{ object.nombre_localidad }}"?</p>
<form method="post">{% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'cuentas:localidad_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
